<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">env-clinic - Environment Diagnostic CLI</title>
  <desc id="desc">Catch missing and broken .env variables before runtime crashes.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="16" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Left Side: Title & Value -->
  <g transform="translate(60, 56)">
    <!-- Category -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.5">CLI DIAGNOSTICS</text>

    <!-- Main Title -->
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">env-clinic</text>

    <!-- Subtitle -->
    <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#8b949e" font-weight="400">Catch missing &amp; broken <tspan font-family="ui-monospace, monospace" fill="#e6edf3">.env</tspan> variables</text>
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#8b949e" font-weight="400">before your application crashes.</text>

    <!-- Command Box -->
    <g transform="translate(0, 162)">
      <rect width="320" height="48" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="18" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#38bdf8" font-weight="700">$</text>
      <text x="36" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#ffffff" font-weight="600">npx env-clinic</text>
    </g>
  </g>

  <!-- Right Side: Clean Terminal -->
  <g transform="translate(560, 48)">
    <rect width="580" height="244" rx="12" fill="url(#term-bg)"/>
    <rect width="580" height="244" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

    <!-- Window Titlebar -->
    <path d="M 0,12 A 12,12 0 0,1 12,0 L 568,0 A 12,12 0 0,1 580,12 L 580,36 L 0,36 Z" fill="#0d1117"/>
    <line x1="0" y1="36" x2="580" y2="36" stroke="#30363d" stroke-width="1"/>
    
    <circle cx="20" cy="18" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="18" r="5" fill="#ffbd2e"/>
    <circle cx="52" cy="18" r="5" fill="#27c93f"/>
    <text x="290" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e" text-anchor="middle">.env ↔ .env.example</text>

    <!-- Terminal Content -->
    <g transform="translate(24, 56)">
      <!-- Command prompt -->
      <text x="0" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#38bdf8" font-weight="bold">$ <tspan fill="#e6edf3">npx env-clinic</tspan></text>

      <!-- Row 1: PASS -->
      <g transform="translate(0, 44)">
        <rect width="54" height="22" rx="5" fill="#238636"/>
        <text x="27" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">PASS</text>
        <text x="68" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#ffffff">DATABASE_URL</text>
        <text x="260" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#7ee787">✓ present</text>
      </g>

      <!-- Row 2: FAIL -->
      <g transform="translate(0, 80)">
        <rect width="54" height="22" rx="5" fill="#da3633"/>
        <text x="27" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">FAIL</text>
        <text x="68" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#ffffff">STRIPE_SECRET_KEY</text>
        <text x="260" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#ff7b72">✗ MISSING</text>
      </g>

      <!-- Row 3: WARN -->
      <g transform="translate(0, 116)">
        <rect width="54" height="22" rx="5" fill="#9e6a03"/>
        <text x="27" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">WARN</text>
        <text x="68" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#ffffff">OLD_REDIS_URL</text>
        <text x="260" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#d29922">! EXTRA</text>
      </g>
    </g>
  </g>
</svg>

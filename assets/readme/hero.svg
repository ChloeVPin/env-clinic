<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">env-clinic - Environment Diagnostic CLI</title>
  <desc id="desc">Zero-config CLI to find missing, extra, and empty variables in your .env file.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="20" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" rx="20" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Left Column: Title & Information -->
  <g id="title-block" transform="translate(56, 48)">
    <!-- Eyebrow Tag -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1f6feb" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">ENVIRONMENT CLINIC</text>

    <!-- Main Title -->
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">env-clinic</text>

    <!-- Value Proposition -->
    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#e6edf3" font-weight="500">Catch missing &amp; broken <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#38bdf8">.env</tspan> variables</text>
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#e6edf3" font-weight="500">before your application crashes.</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 182)">
      <!-- Zero Config -->
      <rect x="0" y="0" width="116" height="32" rx="16" fill="#238636" fill-opacity="0.2" stroke="#3fb950" stroke-width="1"/>
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#3fb950">✓ Zero Config</text>

      <!-- Interactive Fix -->
      <rect x="126" y="0" width="138" height="32" rx="16" fill="#1f6feb" fill-opacity="0.2" stroke="#58a6ff" stroke-width="1"/>
      <text x="140" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#58a6ff">⚡ Fix &amp; Prune</text>

      <!-- CI/CD Ready -->
      <rect x="274" y="0" width="118" height="32" rx="16" fill="#9e6a03" fill-opacity="0.2" stroke="#d29922" stroke-width="1"/>
      <text x="288" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#d29922">🛡️ CI/CD Gate</text>
    </g>

    <!-- Quick Run Command Box -->
    <g transform="translate(0, 242)">
      <rect x="0" y="0" width="410" height="54" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="20" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#38bdf8" font-weight="700">$</text>
      <text x="38" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#ffffff" font-weight="600">npx env-clinic</text>
      
      <!-- Copy Prompt Hint -->
      <rect x="290" y="12" width="104" height="30" rx="8" fill="#21262d"/>
      <text x="306" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#8b949e">Node.js 20+</text>
    </g>
  </g>

  <!-- Right Column: Interactive Terminal Mockup -->
  <g id="terminal-mockup" transform="translate(540, 36)">
    <!-- Terminal Container -->
    <rect width="604" height="348" rx="14" fill="url(#card-grad)"/>
    <rect width="604" height="348" rx="14" fill="none" stroke="#30363d" stroke-width="1.5"/>

    <!-- Terminal Window Bar -->
    <path d="M 0,14 A 14,14 0 0,1 14,0 L 590,0 A 14,14 0 0,1 604,14 L 604,40 L 0,40 Z" fill="#0d1117"/>
    <line x1="0" y1="40" x2="604" y2="40" stroke="#30363d" stroke-width="1"/>
    
    <!-- Window Control Buttons -->
    <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="20" r="6" fill="#27c93f"/>

    <!-- Window Title -->
    <text x="302" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8b949e" text-anchor="middle">.env ↔ .env.example audit</text>

    <!-- Terminal Content Area -->
    <g id="terminal-body" transform="translate(24, 60)">
      <!-- Command line input -->
      <text x="0" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#38bdf8" font-weight="bold">$ <tspan fill="#e6edf3">npx env-clinic</tspan></text>

      <!-- Diagnostic Status Rows -->
      <!-- Row 1: PASS -->
      <g transform="translate(0, 42)">
        <rect x="0" y="0" width="62" height="24" rx="6" fill="#238636"/>
        <text x="31" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">PASS</text>
        <text x="76" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#ffffff">DATABASE_URL</text>
        <text x="270" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#7ee787">✓ present</text>
      </g>

      <!-- Row 2: FAIL -->
      <g transform="translate(0, 78)">
        <rect x="0" y="0" width="62" height="24" rx="6" fill="#da3633"/>
        <text x="31" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">FAIL</text>
        <text x="76" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#ffffff">STRIPE_SECRET_KEY</text>
        <text x="270" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#ff7b72">✗ MISSING in .env</text>
      </g>

      <!-- Row 3: WARN Extra -->
      <g transform="translate(0, 114)">
        <rect x="0" y="0" width="62" height="24" rx="6" fill="#9e6a03"/>
        <text x="31" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">WARN</text>
        <text x="76" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#ffffff">OLD_REDIS_URL</text>
        <text x="270" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#d29922">! EXTRA (not in sample)</text>
      </g>

      <!-- Row 4: WARN Empty -->
      <g transform="translate(0, 150)">
        <rect x="0" y="0" width="62" height="24" rx="6" fill="#9e6a03"/>
        <text x="31" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">WARN</text>
        <text x="76" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#ffffff">DEBUG_MODE</text>
        <text x="270" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#d29922">! EMPTY value</text>
      </g>

      <!-- Divider line -->
      <line x1="0" y1="194" x2="556" y2="194" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- Summary & Tip -->
      <g transform="translate(0, 218)">
        <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8b949e">Diagnostic Summary:</text>
        <text x="160" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#ff7b72">1 missing</text>
        <text x="245" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8b949e">•</text>
        <text x="260" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#d29922">1 extra</text>
        <text x="325" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8b949e">•</text>
        <text x="340" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#d29922">1 empty</text>

        <rect x="0" y="16" width="556" height="34" rx="8" fill="#1f6feb" fill-opacity="0.12" stroke="#1f6feb" stroke-opacity="0.3" stroke-width="1"/>
        <text x="14" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#58a6ff">💡 Tip: Run <tspan font-weight="700" fill="#ffffff">npx env-clinic --fix</tspan> to fill in missing keys</text>
      </g>
    </g>
  </g>
</svg>

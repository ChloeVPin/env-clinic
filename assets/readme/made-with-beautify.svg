<svg xmlns="http://www.w3.org/2000/svg" width="420" height="64" viewBox="0 0 420 64" role="img" aria-labelledby="bw-title bw-desc">
  <title id="bw-title">README made with beautify-github-readme</title>
  <desc id="bw-desc">Project-native attribution badge linking to beautify-github-readme.</desc>
  <defs>
    <linearGradient id="bw-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="420" height="64" rx="12" fill="url(#bw-bg)"/>
  <rect width="420" height="64" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Icon / Visual Cue -->
  <g transform="translate(18, 16)">
    <rect width="32" height="32" rx="8" fill="#1f6feb" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">✨</text>
  </g>

  <!-- Text -->
  <text x="64" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#8b949e" letter-spacing="1">README MADE WITH</text>
  <text x="64" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="14" font-weight="700" fill="#ffffff">beautify-github-readme</text>

  <!-- Arrow icon -->
  <g transform="translate(376, 24)">
    <path d="M 0 8 L 16 8 M 10 2 L 16 8 L 10 14" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
